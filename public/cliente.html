<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Área do cliente Pão & Gestão"><title>Área do cliente | Pão & Gestão</title><link rel="stylesheet" href="/customer.css"></head><body>
<section id="customer-login" class="customer-login"><form id="customer-login-form" class="login-box"><a href="/">← Pão & Gestão</a><div class="customer-brand">♨</div><h1>Área do cliente</h1><p>Consulte seu crediário com segurança.</p><label>Código da padaria<input name="bakeryCode" maxlength="20" autocomplete="organization" required></label><label>E-mail<input name="email" type="email" maxlength="254" autocomplete="username" required></label><label>Senha<input name="password" type="password" minlength="12" autocomplete="current-password" required></label><button>Entrar</button><small id="customer-error" role="alert"></small></form></section>
<div id="customer-app" class="hidden"><header><div><span class="customer-brand small">♨</span><div><b id="bakery-name">Pão & Gestão</b><small>Área do cliente</small></div></div><button id="customer-logout">Sair</button></header><main><section class="welcome"><p>Olá,</p><h1 id="customer-name">Cliente</h1></section><section class="customer-metrics"><article><small>Saldo devedor</small><strong id="customer-balance">R$ 0,00</strong></article><article><small>Limite disponível</small><strong id="customer-available">R$ 0,00</strong></article><article><small>Limite total</small><strong id="customer-limit">R$ 0,00</strong></article><article><small>Valor vencido</small><strong id="customer-overdue">R$ 0,00</strong></article></section><nav class="customer-tabs"><button class="active" data-tab="open">Em aberto</button><button data-tab="paid">Quitadas</button><button data-tab="payments">Pagamentos</button></nav><section id="customer-content" class="customer-list"></section></main></div>
<script type="module" src="/customer.js"></script></body></html>

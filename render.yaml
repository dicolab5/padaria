services:
  - type: web
    name: pao-e-gestao
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: disable
      - key: DATABASE_URL
        fromDatabase:
          name: padaria-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SYSTEM_ADMIN_NAME
        value: Administrador do Sistema
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SYSTEM_ADMIN_EMAIL
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false

databases:
  - name: padaria-db
    plan: free
    databaseName: padaria_db
    user: padaria_app
